name: smart_vision
description: Real-Time Object Detection Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  image: ^3.3.0
  path: ^1.9.0
  flutter_tts: ^4.2.5
  sqflite: ^2.3.0
  intl: ^0.19.0
  fl_chart: ^0.66.0
  image_picker: ^1.2.4
  video_player: ^2.14.1
  share_plus: ^13.3.1
  tflite_flutter: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_translation: ^0.15.1
  google_mlkit_language_id: ^0.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/labels.txt
    - assets/models/yolov8n.tflite
    - assets/
    - assets/samples/