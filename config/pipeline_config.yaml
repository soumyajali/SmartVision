# SmartVision Automated Dataset Collection & YOLOv8 Training Pipeline Configuration

discovery:
  kaggle:
    enabled: true
    query: "object detection"
    max_pages: 5
    page_size: 20
    sort_by: "votes" # votes, relevance, updated
  huggingface:
    enabled: true
    query: "object-detection"
    limit: 30
    sort_by: "downloads"

download_limits:
  max_downloads: 5               # Maximum datasets to download in a batch
  max_dataset_size_mb: 400       # Skip individual datasets larger than this (safe for 13GB disk)
  min_free_disk_gb: 4.0          # Stop all downloads if free disk falls below this threshold
  retry_attempts: 3              # Retry on transient network errors
  retry_backoff_sec: 2           # Exponential backoff factor
  timeout_sec: 180               # Per-request network timeout

