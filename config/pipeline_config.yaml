dataset_preparation:
  external_datasets_dir: "/Users/sowmya/Desktop/datasets"
  raw_dir: "datasets/raw_downloads"
  output_dir: "datasets/custom_objects"
  manifest_path: "datasets/manifest.json"
  splits:
    train: 0.70
    val: 0.20
    test: 0.10
  random_seed: 42
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  deduplication:
    enabled: true
    hash_algorithm: "md5"
    dhash_threshold: 4

training:
  base_model: "yolov8n.pt"         # Base pretrained weights to fine-tune
  high_acc_base: "yolov8m.pt"      # Optional base for higher accuracy
  imgsz: 640
  batch_size: 16
  epochs: 5                        # 5 for quick local, 20-50 for Colab GPU
  patience: 10
  device: "auto"                   # "auto" detects mps, cuda, or cpu
  seed: 42
  workers: 2
  save_period: 2
  project_dir: "runs/detect"
  run_name: "smartvision_pipeline_run"
  weights_export_dir: "weights"
  production_weight_name: "smartvision_best.pt"

export:
  formats:
    - onnx
    - tflite
  imgsz: 640
  half: false
