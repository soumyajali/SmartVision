name: smart_vision
description: Smart Vision - Real-Time Object Detection mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.1
  flutter_tts: ^4.2.5
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  provider: ^6.1.2
  animations: ^2.0.0
  http: ^1.6.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.7
  image: ^3.3.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
